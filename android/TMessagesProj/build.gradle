android {
    compileSdkVersion 36
    buildToolsVersion '36.0.0'
    ndkVersion "27.2.12479018"

    sourceSets.main.jniLibs.srcDirs = ['./jni/']

    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
        }
    }

    lintOptions {
        disable 'MissingTranslation'
        disable 'ExtraTranslation'
        disable 'BlockedPrivateApi'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8

        coreLibraryDesugaringEnabled true
    }


    defaultConfig {
        minSdkVersion 26
        targetSdkVersion 36

        ndk {
            abiFilters "arm64-v8a"
        }

        def configuredApiId = getProps("TELEGRAM_API_ID")
        def configuredApiHash = getProps("TELEGRAM_API_HASH")
        def configuredAgramPushUrl = getProps("AGRAM_PUSH_BASE_URL")
        if (configuredAgramPushUrl) {
            try {
                def relay = new java.net.URI(configuredAgramPushUrl)
                if (relay.scheme != 'https' || !relay.host || relay.userInfo != null
                        || relay.query != null || relay.fragment != null) {
                    throw new IllegalArgumentException('Invalid HTTPS relay')
                }
                configuredAgramPushUrl = relay.toASCIIString()
            } catch (Exception ignored) {
                throw new GradleException('AGRAM_PUSH_BASE_URL must be an HTTPS relay URL without credentials, query or fragment')
            }
        }
        // Production builds must never silently fall back to Telegram's public
        // sample credentials. A zero/empty pair keeps IDE sync working; the
        // release task guard below rejects such a build before compilation.
        buildConfigField "int", "TELEGRAM_APP_ID", configuredApiId ? configuredApiId : "0"
        buildConfigField "String", "TELEGRAM_API_HASH", "\"" + (configuredApiHash ? configuredApiHash : "") + "\""
        // Agram owns the Android transport. The HTTPS relay only carries an
        // opaque wake signal and can be replaced with a self-hosted ntfy URL.
        buildConfigField "String", "AGRAM_PUSH_BASE_URL", "\"" + (configuredAgramPushUrl ? configuredAgramPushUrl : "https://ntfy.sh") + "\""

        vectorDrawables.generatedDensities = ['mdpi', 'hdpi', 'xhdpi', 'xxhdpi']

        multiDexEnabled true

        externalNativeBuild {
            cmake {
                version '3.22.1'
                arguments '-DANDROID_STL=c++_static', '-DANDROID_PLATFORM=android-26' //, '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
                targets 'tmessages.49'
            }
        }
    }

    buildTypes {
        debug {
            jniDebuggable true
            shrinkResources false
            multiDexEnabled true
            ndk.debugSymbolLevel = 'FULL'
            buildConfigField "String", "BUILD_VERSION_STRING", "\"" + APP_VERSION_NAME + "\""
            buildConfigField "String", "BETA_URL", "\"" + getProps("BETA_PRIVATE_URL") + "\""
            buildConfigField "boolean", "DEBUG_VERSION", "true"
            buildConfigField "boolean", "DEBUG_PRIVATE_VERSION", "true"
            buildConfigField "boolean", "BUNDLE", "false"
            buildConfigField "int", "VERSION_NUM", "0"
        }

        HA_private {
            matchingFallbacks = ['release']
            jniDebuggable false
            multiDexEnabled true
            ndk.debugSymbolLevel = 'FULL'
            buildConfigField "String", "BUILD_VERSION_STRING", "\"" + APP_VERSION_NAME + "\""
            buildConfigField "String", "BETA_URL", "\"" + getProps("BETA_PRIVATE_URL") + "\""
            buildConfigField "boolean", "DEBUG_VERSION", "true"
            buildConfigField "boolean", "DEBUG_PRIVATE_VERSION", "true"
            buildConfigField "boolean", "BUNDLE", "false"
            buildConfigField "int", "VERSION_NUM", "1"
        }

        HA_public {
            matchingFallbacks = ['release']
            jniDebuggable false
            multiDexEnabled true
            ndk.debugSymbolLevel = 'FULL'
            buildConfigField "String", "BUILD_VERSION_STRING", "\"" + APP_VERSION_NAME + "\""
            buildConfigField "String", "BETA_URL", "\"" + getProps("BETA_PUBLIC_URL") + "\""
            buildConfigField "boolean", "DEBUG_VERSION", "true"
            buildConfigField "boolean", "DEBUG_PRIVATE_VERSION", "false"
            buildConfigField "boolean", "BUNDLE", "false"
            buildConfigField "int", "VERSION_NUM", "4"
        }

        HA_hardcore {
            matchingFallbacks = ['release']
            jniDebuggable false
            multiDexEnabled true
            ndk.debugSymbolLevel = 'FULL'
            buildConfigField "String", "BUILD_VERSION_STRING", "\"" + APP_VERSION_NAME + "\""
            buildConfigField "String", "BETA_URL", "\"" + getProps("BETA_HARDCORE_URL") + "\""
            buildConfigField "boolean", "DEBUG_VERSION", "true"
            buildConfigField "boolean", "DEBUG_PRIVATE_VERSION", "true"
            buildConfigField "boolean", "BUNDLE", "false"
            buildConfigField "int", "VERSION_NUM", "5"
        }

        standalone {
            matchingFallbacks = ['release']
            jniDebuggable false
            multiDexEnabled true
            ndk.debugSymbolLevel = 'FULL'
            buildConfigField "String", "BUILD_VERSION_STRING", "\"" + APP_VERSION_NAME + "\""
            buildConfigField "String", "BETA_URL", "\"\""
            buildConfigField "boolean", "DEBUG_VERSION", "false"
            buildConfigField "boolean", "DEBUG_PRIVATE_VERSION", "false"
            buildConfigField "boolean", "BUNDLE", "false"
            buildConfigField "int", "VERSION_NUM", "6"
        }

        release {
            jniDebuggable false
            shrinkResources false
            multiDexEnabled true
            ndk.debugSymbolLevel = 'FULL'
            buildConfigField "String", "BUILD_VERSION_STRING", "\"" + APP_VERSION_NAME + "\""
            buildConfigField "String", "BETA_URL", "\"\""
            buildConfigField "boolean", "DEBUG_VERSION", "false"
            buildConfigField "boolean", "DEBUG_PRIVATE_VERSION", "false"
            buildConfigField "boolean", "BUNDLE", "false"
            buildConfigField "int", "VERSION_NUM", "7"
        }
    }

    namespace 'org.telegram.messenger'
}


def getProps(String propName) {
    if (propName in ['TELEGRAM_API_ID', 'TELEGRAM_API_HASH', 'AGRAM_PUSH_BASE_URL']) {
        def environmentValue = System.getenv(propName)
        if (environmentValue) return environmentValue
    }
    def propsFile = rootProject.file('local.properties')
    if (propsFile.exists()) {
        def props = new Properties()
        props.load(new FileInputStream(propsFile))
        return props[propName]
    } else {
        return "";
    }
}
apply plugin: 'com.google.gms.google-services'

task checkVisibility {
    doFirst {
        def isPrivateBuild = project.gradle.startParameter.taskNames.find {
            it.contains("HA_private") || it.contains("HA_hardcore") || it.contains("Debug") || it.contains("Release")
        }
        def isPublicAllowed = !project.hasProperty("IS_PRIVATE") || !project.property("IS_PRIVATE").toBoolean()
        if (!isPrivateBuild && !isPublicAllowed) {
            throw new GradleException("Building public version of private code!")
        }
    }
    doLast {
        if (project.gradle.startParameter.taskNames.find { it.contains("HA_public") }) {
            def privateBuild = file("${projectDir}_AppHockeyApp/afat/HA_private/Telegram-Beta.apk")
            if (privateBuild.exists()) {
                privateBuild.delete()
            }
        }
    }
}

task checkAgramApiCredentials {
    doLast {
        def requested = project.gradle.startParameter.taskNames.collect { it.toLowerCase(Locale.ROOT) }
        def productionBuild = requested.any {
            (it.contains("assemble") || it.contains("bundle") || it.contains("standalone") || it.contains("release")) && !it.contains("debug")
        }
        if (!productionBuild) {
            return
        }
        def apiId = getProps("TELEGRAM_API_ID")?.toString()?.trim()
        def apiHash = getProps("TELEGRAM_API_HASH")?.toString()?.trim()
        if (!(apiId ==~ /[1-9][0-9]*/) || !(apiHash ==~ /[0-9a-fA-F]{32}/)) {
            throw new GradleException("Agram production builds require private TELEGRAM_API_ID and TELEGRAM_API_HASH values in local.properties or the protected CI environment.")
        }
    }
}

preBuild.dependsOn checkVisibility, checkAgramApiCredentials

// Gradle's incremental classpath snapshotter intermittently fails on large
// transformed Android dependency jars on Windows (AccessDeniedException after
// javac has already finished). Full javac compilation is slower but reliable.
tasks.withType(JavaCompile).configureEach {
    if (System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')) {
        options.incremental = false
        // Fork javac so Gradle's in-process JavacFileManager does not trip the
        // Windows zipfs/antivirus lock bug while closing transformed AAR jars.
        options.fork = true
        options.forkOptions.memoryMaximumSize = '6g'
        options.forkOptions.executable = new File(System.getProperty('java.home'), 'bin/javac.exe').absolutePath
    }
}
