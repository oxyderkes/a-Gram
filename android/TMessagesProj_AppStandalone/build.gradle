apply plugin: 'com.android.application'
apply plugin: 'org.telegram.build-app-plugin'

// Gradle's in-process javac leaks zipfs handles on Windows and can omit
// same-module sources after the resulting AccessDeniedException. A short-lived
// external javac process closes those handles deterministically.
tasks.withType(JavaCompile).configureEach {
    if (System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')) {
        options.incremental = false
        options.fork = true
        options.forkOptions.memoryMaximumSize = '6g'
        options.forkOptions.executable = new File(System.getProperty('java.home'), 'bin/javac.exe').absolutePath
    }
}

repositories {
    mavenCentral()
    google()
}

configurations {
    compile.exclude module: 'support-v4'
}

configurations.all {
    exclude group: 'com.google.firebase', module: 'firebase-core'
    exclude group: 'com.google.firebase', module: 'firebase-messaging'
    exclude group: 'com.google.firebase', module: 'firebase-iid'
    exclude group: 'androidx.recyclerview', module: 'recyclerview'
}

dependencies {
    implementation project(':TMessagesProj')
    implementation 'androidx.fragment:fragment:1.8.9'
    implementation 'androidx.core:core:1.16.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation files('../TMessagesProj/libs/libgsaverification-client.aar')
}

def agramReleaseStorePassword = System.getenv('AGRAM_RELEASE_STORE_PASSWORD') ?: (findProperty('RELEASE_STORE_PASSWORD') ?: '')
def agramReleaseKeyPassword = System.getenv('AGRAM_RELEASE_KEY_PASSWORD') ?: (findProperty('RELEASE_KEY_PASSWORD') ?: '')
def agramReleaseKeyAlias = System.getenv('AGRAM_RELEASE_KEY_ALIAS') ?: (findProperty('RELEASE_KEY_ALIAS') ?: 'manygram')
// Explicit unsigned verification lane; never silently substitute a signing identity.
def agramUnsignedBuild = providers.gradleProperty('AGRAM_UNSIGNED_BUILD').orNull == 'true'

android {
    compileSdkVersion 36
    buildToolsVersion '36.0.0'

    defaultConfig.applicationId = APP_PACKAGE

    sourceSets.main.jniLibs.srcDirs = ['../TMessagesProj/jni/']

    lintOptions {
        disable 'MissingTranslation'
        disable 'ExtraTranslation'
        disable 'BlockedPrivateApi'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8

        coreLibraryDesugaringEnabled true
    }

    androidResources {
        noCompress += "pack"
        localeFilters += ["zz"]
    }

    signingConfigs {
        debug {
            storeFile file("../TMessagesProj/config/manygram.keystore")
            storePassword agramReleaseStorePassword
            keyAlias agramReleaseKeyAlias
            keyPassword agramReleaseKeyPassword
        }

        release {
            storeFile file("../TMessagesProj/config/manygram.keystore")
            storePassword agramReleaseStorePassword
            keyAlias agramReleaseKeyAlias
            keyPassword agramReleaseKeyPassword
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
            signingConfig signingConfigs.debug
            applicationIdSuffix ".debug"
            minifyEnabled false
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), '../TMessagesProj/proguard-rules.pro'
            ndk.debugSymbolLevel = 'FULL'
        }
        standalone {
            matchingFallbacks = ['release']
            debuggable false
            jniDebuggable false
            signingConfig agramUnsignedBuild ? null : signingConfigs.release
            minifyEnabled true
            shrinkResources true
            multiDexEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), '../TMessagesProj/proguard-rules.pro'
            ndk.debugSymbolLevel = 'FULL'
        }
    }

    sourceSets.debug {
        manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_standalone.xml'
    }
    sourceSets.standalone {
        manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_standalone.xml'
    }

    flavorDimensions "minApi"

    productFlavors {
        afat {
            ndk {
                // Pixel devices supported by GrapheneOS use 64-bit ARM.
                abiFilters "arm64-v8a"
            }
            ext {
                abiVersionCode = 9
            }
            sourceSets.standalone {
                manifest.srcFile '../TMessagesProj/config/release/AndroidManifest_standalone.xml'
            }
        }
    }

    defaultConfig.versionCode = Integer.parseInt(APP_VERSION_CODE)

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "app.apk"
            output.versionCodeOverride = defaultConfig.versionCode * 10 + variant.productFlavors.get(0).abiVersionCode
        }
    }

    variantFilter { variant ->
        def names = variant.flavors*.name
        if (variant.buildType.name != "release" && !names.contains("afat")) {
            setIgnore(true)
        }
    }

    defaultConfig {
        minSdkVersion 26
        targetSdkVersion 36
        versionName APP_VERSION_NAME
        ndkVersion "27.2.12479018"

        multiDexEnabled true

        vectorDrawables.generatedDensities = ['mdpi', 'hdpi', 'xhdpi', 'xxhdpi']

        externalNativeBuild {
            cmake {
                version '3.22.1'
                arguments '-DANDROID_STL=c++_static', '-DANDROID_PLATFORM=android-26' //, '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
                targets 'tmessages.49'
            }
        }
    }

    buildFeatures {
        buildConfig = true
    }
    namespace 'org.telegram.messenger.web'

    lintOptions {
        checkReleaseBuilds false
    }
}
